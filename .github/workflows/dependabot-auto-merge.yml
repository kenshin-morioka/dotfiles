name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # agents 側の PR でレビュー済みの内容を指すだけなので、submodule の参照更新に限り確認を省く。
      # 判定は ecosystem 名ではなく実際の変更ファイルで行う (agents 以外を含む PR は対象外)
      - name: Merge agents submodule update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          changed=$(gh pr diff "$PR_URL" --name-only)
          if [ "$changed" != "agents" ]; then
            echo "agents submodule の更新のみではないためスキップ: $changed"
            exit 0
          fi
          gh pr merge "$PR_URL" --merge

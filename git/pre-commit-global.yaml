# 全リポジトリ共通の pre-commit チェック (core.hooksPath の共通ゲートから呼ばれる)
# リポジトリを問わず正しいと言えるものだけを集めている。
# リポジトリ固有のチェックは、各リポジトリの .pre-commit-config.yaml に書くこと
repos:
  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

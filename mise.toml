# dotfiles のタスク定義 (mise run <task> で実行 / mise tasks で一覧表示)
# - リポジトリのルートは mise が設定する $MISE_PROJECT_ROOT から解決する (CI 等、checkout 先が異なる環境でも動くように)

[settings]
# mise/config.toml がプロジェクト設定としても読み込まれるため、タスク実行前に言語ランタイムが自動インストールされるのを防ぐ
task.run_auto_install = false

# --------------------------------------
# 一括セットアップ
#
[tasks.setup]
description = "新マシンのセットアップを一括実行（冪等・再実行可）"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
echo "🚀 セットアップを開始します..."
# Homebrew は前提条件。未インストールなら明確に案内して中断する（自動インストールはしない）
if ! command -v brew >/dev/null 2>&1; then
  echo "❌ Homebrew がインストールされていません"
  echo "   以下を実行してから再度 mise run setup を実行してください:"
  echo '   /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
  exit 1
fi
mise run brew
echo "📥 submodule を取得中..."
git -C "$MISE_PROJECT_ROOT" submodule update --init
# pull 時に submodule も更新し、post-merge フックの link で新規スキル等を反映させる (.git/config に書くためリポジトリ追跡外)
git -C "$MISE_PROJECT_ROOT" config submodule.recurse true
# 雛形から生成する git 追跡外ファイルは、link より先に作っておく (無いと link で skip される)
mise run codex-init
mise run link
mise run macos-defaults
mise run macos-app
# fzf キーバインド: install スクリプトは ~/.fzf.zsh を同内容で再生成するだけなので再実行しても安全（冪等）。
# --no-update-rc により rc ファイルへの追記を抑止する（.zshrc はリポジトリへのシンボリックリンクのため、書き換えられると差分が発生する）。
echo "🔑 fzf キーバインドをセットアップ中..."
"$(brew --prefix)/opt/fzf/install" --key-bindings --completion --no-update-rc --no-bash --no-fish
mise run tmux-init
echo "🪝 pre-commit フックを設定中..."
cd "$MISE_PROJECT_ROOT" && pre-commit install
echo "🤝 mise 設定を信頼中..."
mise trust "$MISE_PROJECT_ROOT/mise/config.toml" || true
# tflint は Homebrew ではなく mise (mise/config.toml) で管理している。task.run_auto_install = false のため明示的にインストールする
echo "🔧 tflint をインストール中..."
mise install tflint
# 警告や確認が他の出力に埋もれないよう最後に実行する
mise run brew-sync
mise run brew-check
echo "✅ セットアップが完了しました！"
'''

# --------------------------------------
# シンボリックリンク (定義は symlinks.txt)
#
# 既存の ~/.ssh/config (実ファイル) をシンボリックリンクで上書きしてしまう前に
# ~/.ssh/config.local へ退避する。ssh/config は config.local を Include するため挙動は変わらない。
[tasks.ssh-migrate]
# setup の内部ステップ (単体で使う場面がないため一覧から隠す)
hide = true
description = "既存の ~/.ssh/config を config.local へ退避 (link の前に自動実行)"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
if [ -f "$HOME/.ssh/config" ] && [ ! -L "$HOME/.ssh/config" ]; then
  if [ -e "$HOME/.ssh/config.local" ]; then
    echo "❌ ~/.ssh/config (実ファイル) と ~/.ssh/config.local が両方存在します"
    echo "   上書き事故を防ぐため中断しました。~/.ssh/config の内容を config.local に手動で統合してください"
    exit 1
  fi
  cp "$HOME/.ssh/config" "$HOME/.ssh/config.local"
  chmod 600 "$HOME/.ssh/config.local"
  echo "📦 既存の ~/.ssh/config を ~/.ssh/config.local に退避しました"
fi
# ControlPath (接続多重化ソケット) 用ディレクトリ
mkdir -p "$HOME/.ssh/sockets"
chmod 700 "$HOME/.ssh/sockets"
'''

[tasks.link]
description = "シンボリックリンクを作成"
depends = ["ssh-migrate"]
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
echo "🔗 シンボリックリンクを作成中..."
link_one() {
  local src="$1" dst="$2"
  if [ -e "$dst" ] && [ ! -L "$dst" ]; then
    local backup="$dst.backup.$(date +%Y%m%d%H%M%S)"
    mv "$dst" "$backup"
    echo "  📦 既存の $dst を $backup に退避しました"
  fi
  mkdir -p "$(dirname "$dst")"
  ln -snf "$src" "$dst"
  echo "  リンク作成: $dst -> $src"
}
grep -Ev '^[[:space:]]*(#|$)' "$MISE_PROJECT_ROOT/symlinks.txt" | while IFS=: read -r dst src; do
  dst="$HOME/$dst"
  src="$MISE_PROJECT_ROOT/$src"
  # 末尾 `*` は配下のエントリを個別にリンクする (symlinks.txt 冒頭のコメント参照)
  if [ "${src##*/}" = "*" ]; then
    src_dir="${src%/*}"
    dst_dir="${dst%/*}"
    if [ ! -d "$src_dir" ]; then
      echo "  skip: $src_dir (not found)"
      continue
    fi
    for entry in "$src_dir"/*; do
      [ -e "$entry" ] || continue
      link_one "$entry" "$dst_dir/${entry##*/}"
    done
    continue
  fi
  if [ ! -e "$src" ]; then
    echo "  skip: $src (not found)"
    continue
  fi
  link_one "$src" "$dst"
done
'''

[tasks.unlink]
description = "シンボリックリンクを削除"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
echo "❌ シンボリックリンクを削除中..."
grep -Ev '^[[:space:]]*(#|$)' "$MISE_PROJECT_ROOT/symlinks.txt" | while IFS=: read -r dst src; do
  dst="$HOME/$dst"
  src="$MISE_PROJECT_ROOT/$src"
  # 末尾 `*` の行はリンク先ディレクトリ内のうち、その行の元ディレクトリ配下の同名エントリを指すリンクだけを削除する
  # (ツールが生成したローカル専用エントリや手動管理のリンクは残す)
  if [ "${dst##*/}" = "*" ]; then
    dst_dir="${dst%/*}"
    src_dir="${src%/*}"
    [ -d "$dst_dir" ] || continue
    for entry in "$dst_dir"/*; do
      [ -L "$entry" ] || continue
      if [ "$(readlink "$entry")" = "$src_dir/${entry##*/}" ]; then
        rm "$entry"
        echo "  リンク削除: $entry"
      fi
    done
    continue
  fi
  if [ -L "$dst" ]; then
    rm "$dst"
    echo "  リンク削除: $dst"
  fi
done
'''

# --------------------------------------
# Homebrew
#
[tasks.brew]
description = "全パッケージをインストール"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
echo "🍺 パッケージをインストール中..."
brew bundle --file="$MISE_PROJECT_ROOT/homebrew/Brewfile"
'''

# インストール済みマシンでは brew bundle がスキップされるため、新規マシンで初めて
# 失敗する問題 (非公式 tap・配布終了パッケージ) と、Brewfile 外の残留物をここで検出する
[tasks.brew-check]
description = "Brewfile の配布終了パッケージ・非公式 tap と、Brewfile 外の残留物を検出"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
brewfile="$MISE_PROJECT_ROOT/homebrew/Brewfile"
echo "🔍 Brewfile をチェック中..."
errors=0

# 非公式 tap は Homebrew 7 以降 trust が必要になり、新規マシンの brew bundle が失敗する
taps=$(brew bundle list --tap --file="$brewfile")
if [ -n "$taps" ]; then
  echo "❌ Brewfile に非公式 tap があります (新規マシンでは trust 必須で失敗します。mise 管理等へ移行してください):"
  echo "$taps" | sed 's/^/   /'
  errors=1
fi

# deprecated / disabled なパッケージは配布終了 (予定) で、新規インストールが失敗しうる
status_filter='"\(.name // .token) (\(if .disabled then "disabled" else "deprecated" end): \(.disable_reason // .deprecation_reason // "理由不明"))"'
formulae=$(brew bundle list --formula --file="$brewfile")
casks=$(brew bundle list --cask --file="$brewfile")
# パイプラインやコマンド置換の中では brew info の失敗で止まらず、チェックが素通りするため個別に代入する
formula_info='{"formulae":[],"casks":[]}'
cask_info='{"formulae":[],"casks":[]}'
# shellcheck disable=SC2086  # 改行区切りのパッケージ名を引数に展開する
[ -z "$formulae" ] || formula_info=$(brew info --json=v2 --formula $formulae)
# shellcheck disable=SC2086
[ -z "$casks" ] || cask_info=$(brew info --json=v2 --cask $casks)
deprecated=$(printf '%s\n' "$formula_info" "$cask_info" | jq -r "(.formulae + .casks)[] | select(.deprecated or .disabled) | $status_filter")
if [ -n "$deprecated" ]; then
  echo "❌ Brewfile に配布終了 (予定) のパッケージがあります。代替へ移行してください:"
  echo "$deprecated" | sed 's/^/   /'
  errors=1
fi

# Brewfile 外の残留物は、このマシンでだけ動いて新規マシンで再現しない状態の原因になる
extra_taps=$(comm -23 <(brew tap | grep -v '^homebrew/' | sort) <(echo "$taps" | sort))
extra_formulae=$(comm -23 <(brew list --formula --full-name --installed-on-request | sort) <(echo "$formulae" | sort))
extra_casks=$(comm -23 <(brew list --cask | sort) <(echo "$casks" | sort))
if [ -n "$extra_taps$extra_formulae$extra_casks" ]; then
  echo "⚠️  Brewfile にないパッケージがインストールされています (不要なら brew bundle cleanup --force --file=$brewfile で削除、必要なら mise run brew-sync で追記):"
  [ -z "$extra_taps" ] || echo "$extra_taps" | sed 's/^/   tap  /'
  [ -z "$extra_formulae" ] || echo "$extra_formulae" | sed 's/^/   brew /'
  [ -z "$extra_casks" ] || echo "$extra_casks" | sed 's/^/   cask /'
fi
installed_deprecated=$(brew info --installed --json=v2 | jq -r "(.formulae + .casks)[] | select(.deprecated or .disabled) | $status_filter")
if [ -n "$installed_deprecated" ]; then
  echo "⚠️  配布終了 (予定) のパッケージがインストールされています:"
  echo "$installed_deprecated" | sed 's/^/   /'
fi

if [ "$errors" -ne 0 ]; then
  exit 1
fi
echo "✅ Brewfile に問題はありません"
'''

[tasks.brew-add]
description = "パッケージを追加 (mise run brew-add <パッケージ名>)"
usage = 'arg "<pkg>" help="パッケージ名"'
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
brewfile="$MISE_PROJECT_ROOT/homebrew/Brewfile"
pkg="$usage_pkg"
if grep -q "^brew \"$pkg\"" "$brewfile"; then
  echo "⚠️  $pkg は既にBrewfileに存在します"
else
  brew install "$pkg"
  echo "brew \"$pkg\"" >> "$brewfile"
  echo "✅ $pkg を追加・インストールしました"
fi
'''

[tasks.brew-add-cask]
description = "Caskを追加 (mise run brew-add-cask <パッケージ名>)"
usage = 'arg "<pkg>" help="パッケージ名"'
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
brewfile="$MISE_PROJECT_ROOT/homebrew/Brewfile"
pkg="$usage_pkg"
if grep -q "^cask \"$pkg\"" "$brewfile"; then
  echo "⚠️  $pkg は既にBrewfileに存在します"
else
  brew install --cask "$pkg"
  echo "cask \"$pkg\"" >> "$brewfile"
  echo "✅ $pkg を追加・インストールしました"
fi
'''

[tasks.brew-sync]
description = "Brewfile にないインストール済みパッケージを確認のうえ Brewfile に追記"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
brewfile="$MISE_PROJECT_ROOT/homebrew/Brewfile"
# brew bundle dump はコメント・グループ分けを消し、非公式 tap も書き込むため使わず追記だけ行う
# 非公式 tap のパッケージは新規マシンで trust 必須で失敗するため対象外にする
new_formulae=$(comm -23 <(brew list --formula --full-name --installed-on-request | grep -v / | sort) <(brew bundle list --formula --file="$brewfile" | sort))
new_casks=$(comm -23 \
  <(brew info --installed --json=v2 | jq -r '.casks[] | select(.tap == "homebrew/cask") | .token' | sort) \
  <(brew bundle list --cask --file="$brewfile" | sort))
if [ -z "$new_formulae$new_casks" ]; then
  echo "✅ Brewfile とインストール済みパッケージに差分はありません"
  exit 0
fi
# 言語ランタイム等、Homebrew の責務外のものが紛れ込まないよう確認を挟む (docs/TOOLCHAIN.md)
echo "🔄 Brewfile にないパッケージがインストールされています:"
[ -z "$new_formulae" ] || echo "$new_formulae" | sed 's/^/   brew /'
[ -z "$new_casks" ] || echo "$new_casks" | sed 's/^/   cask /'
answer=""
# 非対話実行では入力を待てないため追記しない
[ -t 0 ] && { read -r -p "Brewfile に追記しますか? [y/N] " answer || true; }
if [[ ! "$answer" =~ ^[yY]$ ]]; then
  echo "⏭️  追記をスキップしました"
  exit 0
fi
[ -z "$new_formulae" ] || echo "$new_formulae" | sed 's/.*/brew "&"/' >> "$brewfile"
[ -z "$new_casks" ] || echo "$new_casks" | sed 's/.*/cask "&"/' >> "$brewfile"
echo "✅ Brewfile に追記しました。必要ならグループ分けを整えてコミットしてください"
'''

# --------------------------------------
# Neovim
#
[tasks.nvim-update]
description = "Neovim プラグインを更新してコミット & push まで実行"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
echo "🔄 Neovim プラグインを更新中..."
nvim --headless "+Lazy! sync" +qa
mise run lazy-commit
'''

[tasks.lazy-commit]
description = "nvim/lazy-lock.json の変更だけをコミット & push"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
other_changes=$(git status --porcelain | grep -v 'nvim/lazy-lock.json' || true)
if [ -n "$other_changes" ]; then
  echo "❌ lazy-lock.json 以外の変更があります:"
  echo "$other_changes"
  exit 1
fi
if git diff --quiet -- nvim/lazy-lock.json && git diff --cached --quiet -- nvim/lazy-lock.json; then
  echo "✅ lazy-lock.json に変更なし"
  exit 0
fi
git add nvim/lazy-lock.json
git commit -m "lazy update"
git push origin HEAD
echo "✅ lazy update を push しました"
'''

# --------------------------------------
# tmux
#
[tasks.tmux-init]
# setup の内部ステップ (単体で使う場面がないため一覧から隠す)
hide = true
description = "TPM (Tmux Plugin Manager) をインストール"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
tpm_dir="$HOME/.config/tmux/plugins/tpm"
if [ -d "$tpm_dir" ]; then
  echo "⚠️  TPM は既にインストール済みです: $tpm_dir"
else
  echo "📦 TPM をクローン中..."
  git clone https://github.com/tmux-plugins/tpm "$tpm_dir"
  echo "✅ TPM をインストールしました。tmux 起動後に prefix + I でプラグインを取得してください"
fi
'''

# --------------------------------------
# macOS Launcher App (Finder ダブルクリック → Neovim)
#
[tasks.macos-app]
description = "Finder ダブルクリックで Neovim を開く .app を ~/Applications に生成"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
app_name="OpenInNeovim"
app_dst="$HOME/Applications/$app_name.app"
app_src="$MISE_PROJECT_ROOT/macos/$app_name.applescript"
app_icon_src="$MISE_PROJECT_ROOT/macos/icons/$app_name.png"
app_id="com.kenshin-morioka.openinneovim"
lsregister="/System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/LaunchServices.framework/Versions/A/Support/lsregister"

echo "🛠  $app_name.app をビルド中..."
mkdir -p "$HOME/Applications"
rm -rf "$app_dst"
osacompile -o "$app_dst" "$app_src"
# osacompile 既定では CFBundleIdentifier が空で Launch Services がデフォルトハンドラ登録を拒否するため埋める
plist="$app_dst/Contents/Info.plist"
/usr/libexec/PlistBuddy -c "Delete :CFBundleIdentifier" "$plist" 2>/dev/null || true
/usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $app_id" "$plist"
# Neovim ロゴ PNG をマルチ解像度 .icns にして差し替え。
# osacompile の `on open` ハンドラ付き .app は droplet 扱いで CFBundleIconFile=droplet なので droplet.icns を上書きする。
# また Assets.car (compiled icon catalog) が .icns より優先されるため削除する。
iconset="$(mktemp -d)/$app_name.iconset"
mkdir -p "$iconset"
for size in 16 32 64 128 256 512; do
  sips -z "$size" "$size" "$app_icon_src" --out "$iconset/icon_${size}x${size}.png" >/dev/null
done
iconutil -c icns "$iconset" -o "$app_dst/Contents/Resources/droplet.icns"
cp "$app_dst/Contents/Resources/droplet.icns" "$app_dst/Contents/Resources/applet.icns"
rm -f "$app_dst/Contents/Resources/Assets.car"
codesign --force --deep --sign - "$app_dst"
"$lsregister" -f "$app_dst"
echo "✅ $app_dst を生成しました (bundle id: $app_id)"
echo "   Finder で対象ファイルを右クリック → 情報を見る → このアプリケーションで開く → $app_name → すべてを変更"
'''

[tasks.macos-defaults]
description = "macOS の defaults を適用 (WezTerm の PressAndHold 無効化等)"
quiet = true
run = 'bash "$MISE_PROJECT_ROOT/macos/defaults.sh"'

[tasks.codex-init]
# setup の内部ステップ (単体で使う場面がないため一覧から隠す)
hide = true
description = "Codex の dotfiles プロファイル設定を雛形から生成"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
cfg="$MISE_PROJECT_ROOT/agents/codex/dotfiles.config.toml"
if [ -f "$cfg" ]; then
  echo "⚠️  $cfg は既に存在します"
else
  cp "$cfg.example" "$cfg"
  echo "✅ $cfg を雛形から作成しました"
fi
'''

# --------------------------------------
# Lean (elan)
#
# mise の ubi バックエンドで入れた elan は単体バイナリのみで、lean / lake 等のプロキシが作られない。
# elan は argv[0] でプロキシとして動くため、同じディレクトリ (mise が PATH に通す) に elan へのシンボリックリンクを置く。
# elan のバージョン更新後に消えるため、プロジェクトで mise install した後に実行する (冪等)
[tasks.elan-link]
description = "mise 管理の elan に lean / lake 等のプロキシ (シンボリックリンク) を作成"
shell = "bash -c"
quiet = true
run = '''
set -euo pipefail
base="${MISE_DATA_DIR:-$HOME/.local/share/mise}/installs/ubi-leanprover-elan"
found=0
for elan in "$base"/*/elan; do
  [ -x "$elan" ] || continue
  found=1
  dir="$(dirname "$elan")"
  for t in lean lake leanc leanchecker leanmake; do
    ln -sf elan "$dir/$t"
  done
  echo "✅ $dir にプロキシを作成しました"
done
if [ "$found" -eq 0 ]; then
  echo "❌ mise 管理の elan が見つかりません。プロジェクトで mise install を実行してください"
  exit 1
fi
'''

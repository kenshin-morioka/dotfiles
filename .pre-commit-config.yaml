# post-merge / post-checkout は relink 用。それ以外のフックは従来どおり pre-commit でのみ実行する
default_install_hook_types: [pre-commit, post-merge, post-checkout]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: typos
        name: typos (spell checker)
        entry: typos --force-exclude
        language: system
        types: [text]

      - id: selene
        name: selene (lua linter)
        entry: selene --allow-warnings
        language: system
        types: [lua]

      - id: shellcheck
        name: shellcheck (shell linter)
        entry: shellcheck
        language: system
        types: [shell]

      - id: jsonlint
        name: jsonlint (json linter)
        entry: jsonlint
        language: system
        types: [json]

      - id: markdownlint
        name: markdownlint (markdown linter)
        entry: markdownlint
        language: system
        types: [markdown]

      # 追跡禁止ファイルが .gitignore から外れていないか
      - id: check-never-tracked
        name: check never-tracked files
        entry: scripts/check-never-tracked.sh
        language: script
        pass_filenames: false
        always_run: true

      # pull 後に agents を最新の main に更新する (relink より先に実行して新規スキルのリンクも反映させる)
      - id: update-agents
        name: update-agents (agents を最新の main に更新)
        entry: git submodule update --remote agents
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-merge]

      # pull・ブランチ切り替え後にシンボリックリンクを張り直す (新規スキル等の反映)
      - id: relink
        name: relink (mise run link)
        entry: scripts/relink.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [post-merge, post-checkout]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
